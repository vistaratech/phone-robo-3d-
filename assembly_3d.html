<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhoneBot SG90 - 3D Assembly Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      overflow: hidden;
      height: 100vh;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    canvas { display: block; }

    /* Header */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0) 100%);
      pointer-events: none;
    }

    .header > * { pointer-events: auto; }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .logo span { color: #6c63ff; }
    .logo .dot { color: #ff6b6b; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #a09aff;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6c63ff;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* Side Panel */
    .panel {
      position: fixed;
      top: 70px;
      right: 16px;
      bottom: 80px;
      width: 280px;
      z-index: 100;
      background: rgba(18, 18, 28, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(108,99,255,0.3) transparent;
    }

    .panel h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6c63ff;
      margin-bottom: 12px;
    }

    .part-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 2px;
    }

    .part-item:hover {
      background: rgba(108,99,255,0.1);
    }

    .part-item.active {
      background: rgba(108,99,255,0.2);
      border: 1px solid rgba(108,99,255,0.3);
    }

    .part-color {
      width: 12px; height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .part-name {
      font-size: 12px;
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .part-qty {
      font-size: 10px;
      font-weight: 600;
      color: #888;
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .servo-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .servo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      margin-bottom: 2px;
    }

    .servo-color {
      width: 12px; height: 12px;
      border-radius: 3px;
      background: #ff6b6b;
      flex-shrink: 0;
    }

    .servo-label {
      font-size: 12px;
      color: #ff9a9a;
      font-weight: 500;
    }

    /* Controls bar */
    .controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 8px;
      padding: 8px;
      background: rgba(18, 18, 28, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
    }

    .ctrl-btn {
      padding: 10px 18px;
      background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.2);
      border-radius: 8px;
      color: #c0bcff;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(108,99,255,0.25);
      border-color: rgba(108,99,255,0.5);
      color: #fff;
    }

    .ctrl-btn.active {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
    }

    /* Loading */
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }

    .loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(108,99,255,0.2);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      margin-top: 16px;
      font-size: 14px;
      color: #888;
    }

    .loader-progress {
      margin-top: 8px;
      font-size: 12px;
      color: #6c63ff;
      font-weight: 600;
    }

    /* Info tooltip */
    .info-card {
      position: fixed;
      bottom: 80px;
      left: 16px;
      z-index: 100;
      background: rgba(18,18,28,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 14px 18px;
      max-width: 280px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .info-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .info-card h4 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .info-card p {
      font-size: 11px;
      color: #999;
      line-height: 1.5;
    }

    .info-card .dims {
      margin-top: 6px;
      font-size: 11px;
      color: #6c63ff;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="loader-overlay" id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading PhoneBot Assembly...</div>
    <div class="loader-progress" id="loader-progress">0 / 11 parts</div>
  </div>

  <div class="header">
    <div class="logo">Phone<span>Bot</span><span class="dot">.</span> SG90</div>
    <div class="badge">Interactive 3D Assembly</div>
  </div>

  <div id="canvas-container"></div>

  <div class="panel" id="parts-panel">
    <h3>Printed Parts</h3>
    <div id="parts-list"></div>
    <div class="servo-section">
      <h3>SG90 Servos (x8)</h3>
      <div id="servo-list"></div>
    </div>
  </div>

  <div class="info-card" id="info-card">
    <h4 id="info-name"></h4>
    <p id="info-desc"></p>
    <div class="dims" id="info-dims"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn active" onclick="setView('assembled')">Assembled</button>
    <button class="ctrl-btn" onclick="setView('exploded')">Exploded</button>
    <button class="ctrl-btn" onclick="toggleServos()">Show/Hide Servos</button>
    <button class="ctrl-btn" onclick="toggleWireframe()">Wireframe</button>
    <button class="ctrl-btn" onclick="resetCamera()">Reset View</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // ── Part definitions ──
    // All parts are loaded in their NATIVE STL coordinate system (no centering).
    // The STL coordinate system uses Z-up. Three.js uses Y-up.
    // Rotation [-PI/2, 0, 0] converts: STL_X→Three_X, STL_Y→Three_-Z, STL_Z→Three_Y
    //
    // Body parts (TorsoBase, PelvisTop, PelvisBottom, PhoneMount, ElectronicsFrame)
    // share a common coordinate origin and align naturally at pos=[0,0,0].
    //
    // Leg parts (HipBracket, MotorConnection, UpperLeg, LowerLeg, Foot, IdlerBracket)
    // are designed for one side; mirrored sides use scale.x = -1.
    //
    // The "mirror" flag on a part causes X-axis mirroring instead of Z-rotation.

    const PARTS = [
      // ─── Body (center) ───
      {
        file: 'SG90/TorsoBase_x1.stl', name: 'TorsoBase', qty: 1,
        color: 0x4a90d9, desc: 'Main body frame — holds hip servos',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0, 0.8, 0]
      },
      {
        file: 'SG90/PelvisTop_x1.stl', name: 'PelvisTop', qty: 1,
        color: 0x50c878, desc: 'Upper pelvis plate — servo slots (SG90 modified)',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0, 0.3, 0]
      },
      {
        file: 'SG90/PelvisBottom_x1.stl', name: 'PelvisBottom', qty: 1,
        color: 0x3cb371, desc: 'Lower pelvis plate — servo slots (SG90 modified)',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0, -0.6, 0]
      },
      {
        file: 'SG90/PhoneMount_x1.stl', name: 'PhoneMount', qty: 1,
        color: 0x9b59b6, desc: 'Smartphone holder on top',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0, 1.5, 0]
      },
      {
        file: 'SG90/ElectronicsFrame_x1.stl', name: 'ElectronicsFrame', qty: 1,
        color: 0xe67e22, desc: 'Electronics mounting plate',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0, 1.0, 0.3]
      },

      // ─── Front-Left leg (native orientation) ───
      {
        file: 'SG90/HipBracket_x2.stl', name: 'HipBracket (FL)', qty: '2 total',
        color: 0xe74c3c, desc: 'Front-Left hip joint bracket',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [1.0, -0.5, -0.8]
      },
      {
        file: 'SG90/MotorConnection_x4.stl', name: 'MotorConnection (FL)', qty: '4 total',
        color: 0xf39c12, desc: 'FL hip servo mount (SG90 modified)',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0.8, -0.2, -0.5]
      },
      {
        file: 'SG90/UpperLegLink_x2.stl', name: 'UpperLeg (FL)', qty: '2 total',
        color: 0x1abc9c, desc: 'Front-Left upper leg link',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [1.2, -0.5, -0.6]
      },
      {
        file: 'SG90/LowerLegLink_x2.stl', name: 'LowerLeg (FL)', qty: '2 total',
        color: 0x16a085, desc: 'Front-Left lower leg link',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [1.2, -1.0, -0.4]
      },
      {
        file: 'SG90/Foot_x2.stl', name: 'Foot (FL)', qty: '2 total',
        color: 0x2c3e50, desc: 'Front-Left foot',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0.6, -1.5, -0.3]
      },
      {
        file: 'SG90/IdlerServoBracket_x4.stl', name: 'IdlerBracket (FL)', qty: '4 total',
        color: 0x95a5a6, desc: 'FL knee idler bracket',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0.5, 0.3, 0.3]
      },

      // ─── Front-Right leg (mirrored X) ───
      {
        file: 'SG90/HipBracket_x2.stl', name: 'HipBracket (FR)', qty: '',
        color: 0xe74c3c, desc: 'Front-Right hip joint bracket',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-1.0, -0.5, -0.8]
      },
      {
        file: 'SG90/MotorConnection_x4.stl', name: 'MotorConnection (FR)', qty: '',
        color: 0xf39c12, desc: 'FR hip servo mount (SG90 modified)',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-0.8, -0.2, -0.5]
      },
      {
        file: 'SG90/UpperLegLink_x2.stl', name: 'UpperLeg (FR)', qty: '',
        color: 0x1abc9c, desc: 'Front-Right upper leg link',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-1.2, -0.5, -0.6]
      },
      {
        file: 'SG90/LowerLegLink_x2.stl', name: 'LowerLeg (FR)', qty: '',
        color: 0x16a085, desc: 'Front-Right lower leg link',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-1.2, -1.0, -0.4]
      },
      {
        file: 'SG90/Foot_x2.stl', name: 'Foot (FR)', qty: '',
        color: 0x2c3e50, desc: 'Front-Right foot',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-0.6, -1.5, -0.3]
      },
      {
        file: 'SG90/IdlerServoBracket_x4.stl', name: 'IdlerBracket (FR)', qty: '',
        color: 0x95a5a6, desc: 'FR knee idler bracket',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-0.5, 0.3, 0.3]
      },

      // ─── Rear-Left leg (same files, offset along STL Y axis) ───
      // Rear legs are same parts but mounted at the rear hip positions.
      // The rear hip is ~56mm behind front hip in STL-Y (Three.js -Z).
      // PhoneBot design: parts are designed at one hip position.
      // For rear, we offset by the hip spacing along Y.
      {
        file: 'SG90/HipBracket_x2.stl', name: 'HipBracket (RL)', qty: '',
        color: 0xe74c3c, desc: 'Rear-Left hip joint bracket',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [1.0, -0.5, 0.8]
      },
      {
        file: 'SG90/MotorConnection_x4.stl', name: 'MotorConnection (RL)', qty: '',
        color: 0xf39c12, desc: 'RL hip servo mount (SG90 modified)',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0.8, -0.2, 0.5]
      },
      {
        file: 'SG90/UpperLegLink_x2.stl', name: 'UpperLeg (RL)', qty: '',
        color: 0x1abc9c, desc: 'Rear-Left upper leg link',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [1.2, -0.5, 0.6]
      },
      {
        file: 'SG90/LowerLegLink_x2.stl', name: 'LowerLeg (RL)', qty: '',
        color: 0x16a085, desc: 'Rear-Left lower leg link',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [1.2, -1.0, 0.4]
      },
      {
        file: 'SG90/Foot_x2.stl', name: 'Foot (RL)', qty: '',
        color: 0x2c3e50, desc: 'Rear-Left foot',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0.6, -1.5, 0.3]
      },
      {
        file: 'SG90/IdlerServoBracket_x4.stl', name: 'IdlerBracket (RL)', qty: '',
        color: 0x95a5a6, desc: 'RL knee idler bracket',
        pos: [0, 0, 0], mirror: false,
        explodeDir: [0.5, 0.3, -0.3]
      },

      // ─── Rear-Right leg (mirrored X) ───
      {
        file: 'SG90/HipBracket_x2.stl', name: 'HipBracket (RR)', qty: '',
        color: 0xe74c3c, desc: 'Rear-Right hip joint bracket',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-1.0, -0.5, 0.8]
      },
      {
        file: 'SG90/MotorConnection_x4.stl', name: 'MotorConnection (RR)', qty: '',
        color: 0xf39c12, desc: 'RR hip servo mount (SG90 modified)',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-0.8, -0.2, 0.5]
      },
      {
        file: 'SG90/UpperLegLink_x2.stl', name: 'UpperLeg (RR)', qty: '',
        color: 0x1abc9c, desc: 'Rear-Right upper leg link',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-1.2, -0.5, 0.6]
      },
      {
        file: 'SG90/LowerLegLink_x2.stl', name: 'LowerLeg (RR)', qty: '',
        color: 0x16a085, desc: 'Rear-Right lower leg link',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-1.2, -1.0, 0.4]
      },
      {
        file: 'SG90/Foot_x2.stl', name: 'Foot (RR)', qty: '',
        color: 0x2c3e50, desc: 'Rear-Right foot',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-0.6, -1.5, 0.3]
      },
      {
        file: 'SG90/IdlerServoBracket_x4.stl', name: 'IdlerBracket (RR)', qty: '',
        color: 0x95a5a6, desc: 'RR knee idler bracket',
        pos: [0, 0, 0], mirror: true,
        explodeDir: [-0.5, 0.3, -0.3]
      },
    ];

    // SG90 servo representation positions in Three.js coords
    // Computed from TorsoBase servo pocket locations
    const SERVOS = [
      { name: 'SG90 #1 (FL Hip)',  pos: [40, 6, -28] },
      { name: 'SG90 #2 (FR Hip)',  pos: [-40, 6, -28] },
      { name: 'SG90 #3 (RL Hip)',  pos: [40, 6, 28] },
      { name: 'SG90 #4 (RR Hip)',  pos: [-40, 6, 28] },
      { name: 'SG90 #5 (FL Knee)', pos: [30, -40, -12] },
      { name: 'SG90 #6 (FR Knee)', pos: [-30, -40, -12] },
      { name: 'SG90 #7 (RL Knee)', pos: [30, -40, 4] },
      { name: 'SG90 #8 (RR Knee)', pos: [-30, -40, 4] },
    ];

    // ── Three.js Setup ──
    let scene, camera, renderer, controls;
    let partMeshes = [];
    let servoMeshes = [];
    let currentView = 'assembled';
    let explodeAmount = 0;
    let targetExplode = 0;
    let showServos = true;
    let wireframeMode = false;
    let loadedCount = 0;

    function init() {
      scene = new THREE.Scene();

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
      camera.position.set(200, 120, 250);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0, 0);
      controls.minDistance = 80;
      controls.maxDistance = 600;

      // Lights
      const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
      mainLight.position.set(100, 200, 150);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.set(2048, 2048);
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0x6c63ff, 0.3);
      fillLight.position.set(-100, 50, -100);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xff6b6b, 0.2);
      rimLight.position.set(0, -50, -200);
      scene.add(rimLight);

      // Ground grid
      const gridHelper = new THREE.GridHelper(400, 40, 0x222240, 0x15152a);
      gridHelper.position.y = -100;
      scene.add(gridHelper);

      // Ground plane (shadow receiver)
      const groundGeo = new THREE.PlaneGeometry(500, 500);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x0a0a15,
        roughness: 0.9,
        metalness: 0.1,
        transparent: true,
        opacity: 0.5
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -100;
      ground.receiveShadow = true;
      scene.add(ground);

      // Load STLs
      loadParts();

      // Create SG90 servo models
      createServos();

      // UI
      buildPartsPanel();

      // Resize
      window.addEventListener('resize', onResize);

      // Raycaster for hover
      setupRaycaster();

      animate();
    }

    function loadParts() {
      const loader = new THREE.STLLoader();
      const stlDir = 'stl/';
      const totalParts = PARTS.length;

      // Cache loaded geometries to avoid reloading same files
      const geoCache = {};

      PARTS.forEach((part, idx) => {
        const filePath = stlDir + part.file;

        function onGeometry(geometry) {
          geometry.computeVertexNormals();
          // DO NOT center geometry — parts share a common design coordinate system
          // and will naturally align at the origin.

          const material = new THREE.MeshPhysicalMaterial({
            color: part.color,
            roughness: 0.4,
            metalness: 0.1,
            clearcoat: 0.3,
            clearcoatRoughness: 0.4,
            transparent: false,
            side: THREE.DoubleSide,
          });

          const mesh = new THREE.Mesh(geometry.clone(), material);

          // Convert from STL Z-up to Three.js Y-up
          mesh.rotation.x = -Math.PI / 2;

          // Mirror for right-side parts
          if (part.mirror) {
            mesh.scale.x = -1;
          }

          // Apply any additional offset
          mesh.position.set(...part.pos);

          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.userData = { partIndex: idx, partData: part, basePos: [...part.pos] };

          scene.add(mesh);
          partMeshes.push(mesh);

          loadedCount++;
          document.getElementById('loader-progress').textContent =
            `${loadedCount} / ${totalParts} parts`;

          if (loadedCount >= totalParts) {
            setTimeout(() => {
              document.getElementById('loader').classList.add('hidden');
            }, 500);
          }
        }

        if (geoCache[part.file]) {
          onGeometry(geoCache[part.file]);
        } else {
          loader.load(
            filePath,
            (geometry) => {
              geoCache[part.file] = geometry;
              onGeometry(geometry);
            },
            undefined,
            (err) => {
              console.warn('Failed to load:', filePath, err);
              loadedCount++;
              document.getElementById('loader-progress').textContent =
                `${loadedCount} / ${totalParts} parts`;
              if (loadedCount >= totalParts) {
                document.getElementById('loader').classList.add('hidden');
              }
            }
          );
        }
      });
    }

    function createServos() {
      // SG90 body: 22.2 x 11.8 x 22.7 mm with tabs
      SERVOS.forEach((servo, idx) => {
        const group = new THREE.Group();

        // Body
        const bodyGeo = new THREE.BoxGeometry(11.8, 22.7, 22.2);
        const bodyMat = new THREE.MeshPhysicalMaterial({
          color: 0x1a5faa,
          roughness: 0.3,
          metalness: 0.5,
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        group.add(body);

        // Tabs (mounting ears)
        const tabGeo = new THREE.BoxGeometry(11.8, 2.5, 32.2);
        const tabMat = new THREE.MeshPhysicalMaterial({
          color: 0x1a5faa,
          roughness: 0.3,
          metalness: 0.5,
        });
        const tabs = new THREE.Mesh(tabGeo, tabMat);
        tabs.position.y = 5;
        group.add(tabs);

        // Shaft (output gear nub)
        const shaftGeo = new THREE.CylinderGeometry(2.4, 2.4, 4, 16);
        const shaftMat = new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          roughness: 0.2,
          metalness: 0.8,
        });
        const shaft = new THREE.Mesh(shaftGeo, shaftMat);
        shaft.position.y = 13;
        group.add(shaft);

        // Label
        const labelGeo = new THREE.BoxGeometry(8, 0.5, 5);
        const labelMat = new THREE.MeshBasicMaterial({ color: 0xff6b6b });
        const label = new THREE.Mesh(labelGeo, labelMat);
        label.position.y = 15;
        group.add(label);

        group.position.set(...servo.pos);
        group.userData = { servoIndex: idx, servoData: servo };
        scene.add(group);
        servoMeshes.push(group);
      });

      buildServoPanel();
    }

    function buildPartsPanel() {
      const list = document.getElementById('parts-list');
      // Show unique parts only
      const seen = new Set();
      PARTS.forEach((part, idx) => {
        if (part.qty === '') return; // skip duplicates
        const div = document.createElement('div');
        div.className = 'part-item';
        div.innerHTML = `
          <div class="part-color" style="background:#${part.color.toString(16).padStart(6,'0')}"></div>
          <span class="part-name">${part.name}</span>
          <span class="part-qty">x${part.qty}</span>
        `;
        div.onclick = () => highlightPart(part.name);
        list.appendChild(div);
      });
    }

    function buildServoPanel() {
      const list = document.getElementById('servo-list');
      SERVOS.forEach((servo, idx) => {
        const div = document.createElement('div');
        div.className = 'servo-item';
        div.innerHTML = `
          <div class="servo-color"></div>
          <span class="servo-label">${servo.name}</span>
        `;
        list.appendChild(div);
      });
    }

    function highlightPart(name) {
      partMeshes.forEach(m => {
        const pd = m.userData.partData;
        if (pd.name.includes(name.split(' ')[0])) {
          m.material.emissive.setHex(0x333366);
          setTimeout(() => m.material.emissive.setHex(0x000000), 1500);
        }
      });
    }

    // ── View Modes ──
    function setView(mode) {
      currentView = mode;
      targetExplode = mode === 'exploded' ? 1 : 0;
      document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function toggleServos() {
      showServos = !showServos;
      servoMeshes.forEach(g => g.visible = showServos);
    }

    function toggleWireframe() {
      wireframeMode = !wireframeMode;
      partMeshes.forEach(m => {
        m.material.wireframe = wireframeMode;
        m.material.transparent = wireframeMode;
        m.material.opacity = wireframeMode ? 0.6 : 1.0;
      });
    }

    function resetCamera() {
      camera.position.set(200, 120, 250);
      controls.target.set(0, -20, 0);
    }

    // ── Raycaster for hover info ──
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function setupRaycaster() {
      renderer.domElement.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      });
    }

    function updateRaycaster() {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(partMeshes);
      const card = document.getElementById('info-card');

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const pd = hit.userData.partData;
        if (pd) {
          document.getElementById('info-name').textContent = pd.name;
          document.getElementById('info-desc').textContent = pd.desc;
          document.getElementById('info-dims').textContent =
            pd.qty ? `Qty: ${pd.qty}` : '';
          card.classList.add('visible');
          return;
        }
      }
      card.classList.remove('visible');
    }

    // ── Animation Loop ──
    function animate() {
      requestAnimationFrame(animate);

      // Smooth explode animation
      explodeAmount += (targetExplode - explodeAmount) * 0.05;

      partMeshes.forEach(m => {
        const pd = m.userData.partData;
        const base = m.userData.basePos;
        if (pd && base) {
          m.position.x = base[0] + pd.explodeDir[0] * explodeAmount * 80;
          m.position.y = base[1] + pd.explodeDir[1] * explodeAmount * 80;
          m.position.z = base[2] + pd.explodeDir[2] * explodeAmount * 80;
        }
      });

      updateRaycaster();
      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Start
    init();
  </script>
</body>
</html>
